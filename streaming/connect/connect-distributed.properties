# Kafka Connect worker for the Syngenta demo (single worker, single broker).
bootstrap.servers=kafka:19092
group.id=syngenta-connect

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.converters.ByteArrayConverter

config.storage.topic=_connect-configs
offset.storage.topic=_connect-offsets
status.storage.topic=_connect-status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1
offset.flush.interval.ms=5000

# Publish immediately rather than batching, for the latency demo.
producer.linger.ms=0

listeners=http://0.0.0.0:8083
rest.advertised.host.name=connect
plugin.path=/plugins
